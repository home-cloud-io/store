apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: home-assistant
  namespace: {{ .Release.Name }}
  labels:
    app: home-assistant
spec:
  serviceName: home-assistant
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
        domain: apps
    spec:
      initContainers:
        - name: install-hacs
          image: 'homeassistant/home-assistant:{{ .Chart.AppVersion }}'
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ ! -d /config/custom_components/hacs ]; then
                mkdir -p /config/custom_components/hacs
                wget -O /tmp/hacs.zip "https://github.com/hacs/integration/releases/download/{{ .Values.hacs.version }}/hacs.zip"
                unzip /tmp/hacs.zip -d /config/custom_components/hacs
                rm /tmp/hacs.zip
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: 'homeassistant/home-assistant:{{ .Chart.AppVersion }}'
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - 'echo "db_url: $(cat /etc/secrets/postgres/uri)" > /config/secrets.yaml'
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configmap
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
            - name: postgres-secrets
              mountPath: /etc/secrets/postgres
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config
        - name: configmap
          configMap:
            name: home-assistant
        - name: postgres-secrets
          secret:
            secretName: postgres-homeassistant
